<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main style="margin-left:0; padding: 80px 40px; display:flex; align-items:center; justify-content:center; min-height:100vh; background: var(--bg-primary); color: var(--text-main);">
        <div style="max-width:640px; text-align:center;">
            <div style="font-family:'Space Mono', monospace; color: var(--terminal-amber); letter-spacing:0.2em; font-size: 14px; margin-bottom:24px;">ERROR 404</div>
            <h1 style="font-size: clamp(2.5rem, 5vw, 4rem); margin-bottom:16px;">System Route Not Found</h1>
            <p style="color: var(--text-muted); font-size: 1rem; line-height:1.8; margin-bottom:32px;">The requested resource could not be located in the portfolio environment. Return to the main operational manifest or verify the URI command.</p>
            <a href="index.html" style="display:inline-flex; align-items:center; justify-content:center; gap:10px; padding: 14px 24px; border-radius: 999px; background: #ffb000; color: #0a0c10; font-family:'Space Mono', monospace; font-weight:700; text-decoration:none;">RETURN TO PORTAL</a>
        </div>
    </main>
</body>
</html>
